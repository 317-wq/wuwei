server:
  # 服务端口，启动后访问 http://localhost:8080
  port: 8080

spring:
  application:
    name: p2
  jackson:
    # 序列化时忽略 null 字段，响应更干净
    default-property-inclusion: non_null

app:
  jwt:
    # 签名密钥：HS256 要求至少 32 字节；生产环境务必通过环境变量 JWT_SECRET 注入，不要写死在代码库
    secret: ${JWT_SECRET:p2-helloworld-demo-secret-key-change-me-please-0123456789}
    # 令牌有效期：2 小时，支持 s/m/h/d 等单位
    expiration: 2h

logging:
  level:
    # 只打开业务包的日志，避免 Spring Security 调试日志过多
    com.example.p2: INFO
